# Cilium CNI Helm values — E09 T09-1
# License: Apache-2.0
# Usage: helm install cilium cilium/cilium --namespace kube-system -f values.yaml

kubeProxyReplacement: true  # kube-proxy 완전 대체 — Cilium 1.16+ 는 strict/partial 대신 true/false 사용

k8sServiceHost: ""  # TODO: K8s API server IP (make cilium-install 시 자동 감지)
k8sServicePort: "6443"

hubble:
  enabled: true
  relay:
    enabled: true
    replicas: 1
  ui:
    enabled: true
    replicas: 1

encryption:
  enabled: true
  type: wireguard  # 노드 간 트래픽 자동 암호화 — 커널 5.6+ WireGuard 지원 필요

ipam:
  mode: kubernetes

bandwidthManager:
  enabled: true

loadBalancer:
  algorithm: maglev  # 일관된 해싱 로드밸런싱

monitor:
  enabled: true

prometheus:
  enabled: true
  port: 9962
  serviceMonitor:
    enabled: false  # Prometheus Operator 없는 환경은 false

operator:
  prometheus:
    enabled: true

# eBPF 최적화
bpf:
  masquerade: true
  clockProbe: true

# 로깅
debug:
  enabled: false
