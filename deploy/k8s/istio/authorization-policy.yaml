# Istio AuthorizationPolicy — 서비스별 허용 클라이언트 명시 — E10 T10-1
# SeCuardian 앱: Internal Zone 서비스만 접근 허용
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: secuardian-authz
  namespace: secuardian
spec:
  selector:
    matchLabels:
      app: secuardian
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/internal/sa/secuardian-sa"
              - "cluster.local/ns/dmz/sa/caddy-sa"
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            paths: ["/api/*", "/mcp/*", "/a2a/*"]
    # 헬스체크는 모두 허용
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/health", "/metrics"]
