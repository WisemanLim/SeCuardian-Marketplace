# SeCuardian — TruffleHog Secret Scan CI/CD (E06 T06-3 / T02-4)
# License: AGPL-3.0 (TruffleHog) — CI 실행만, 소스 수정·배포 금지
#
# 목적: 커밋/PR 마다 하드코딩된 시크릿 탐지 → 검증된 시크릿 발견 시 즉시 실패
# Panel 5 데이터 소스: 스캔 결과를 SeCuardian /api/observability/mttd/alert 로 전송
#
# 사용법: 이 파일을 프로젝트 루트 .github/workflows/secret-scan.yml 에 복사
# TODO: 운영환경에서 SECUARDIAN_URL 및 SECUARDIAN_TOKEN 을 GitHub Secrets 에 등록

name: TruffleHog Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    # 매일 02:00 UTC 전체 이력 스캔 (ISMS-P 정기 보안 점검)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      scan_depth:
        description: "스캔 커밋 깊이 (0=전체)"
        required: false
        default: "0"

jobs:
  trufflehog:
    name: TruffleHog Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF 업로드

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 이력 스캔을 위해 필요

      # ── TruffleHog 스캔 ────────────────────────────────────────────────────
      - name: TruffleHog — Verified secrets scan (PR/push)
        if: github.event_name != 'schedule'
        id: trufflehog-incremental
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --only-verified
            --fail
            --json
        continue-on-error: true

      - name: TruffleHog — Full history scan (scheduled)
        if: github.event_name == 'schedule'
        id: trufflehog-full
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: >-
            --only-verified
            --fail
            --json
        continue-on-error: true

      # ── 스캔 결과 파싱 ─────────────────────────────────────────────────────
      - name: Parse scan result
        id: parse
        run: |
          INCREMENTAL_EXIT="${{ steps.trufflehog-incremental.outcome }}"
          FULL_EXIT="${{ steps.trufflehog-full.outcome }}"
          COMBINED="${INCREMENTAL_EXIT:-$FULL_EXIT}"

          if [[ "$COMBINED" == "failure" ]]; then
            echo "result=verified" >> "$GITHUB_OUTPUT"
            echo "::error::🔴 검증된 시크릿 발견 — 즉시 로테이션 필요"
          else
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "::notice::✅ 시크릿 스캔 클린"
          fi

      # ── SeCuardian MTTD 알림 전송 (옵션) ──────────────────────────────────
      - name: Notify SeCuardian MTTD endpoint
        if: vars.SECUARDIAN_URL != ''
        env:
          SECUARDIAN_URL: ${{ vars.SECUARDIAN_URL }}
          SECUARDIAN_TOKEN: ${{ secrets.SECUARDIAN_TOKEN }}
          SCAN_RESULT: ${{ steps.parse.outputs.result }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -sf -X POST "${SECUARDIAN_URL}/api/observability/mttd/alert" \
            -H "Content-Type: application/json" \
            -d "{
              \"alert_id\": \"trufflehog-${RUN_ID}\",
              \"source\": \"trufflehog-ci\",
              \"severity\": \"$([ \"$SCAN_RESULT\" = \"verified\" ] && echo critical || echo info)\",
              \"result\": \"${SCAN_RESULT}\",
              \"commit\": \"${COMMIT_SHA:0:8}\",
              \"repo\": \"${{ github.repository }}\",
              \"branch\": \"${{ github.ref_name }}\"
            }" || true

      # ── 실패 시 워크플로우 종료 ────────────────────────────────────────────
      - name: Fail on verified secrets
        if: steps.parse.outputs.result == 'verified'
        run: |
          echo "🔴 검증된 시크릿 발견. 즉시 시크릿을 로테이션하고 Git 이력에서 제거하세요."
          echo "   참조: .docs/ClaudePlan.md §10.4 TruffleHog FP 가이드"
          exit 1
