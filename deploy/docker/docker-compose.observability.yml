# Source: Prometheus(Apache-2.0) · Grafana/Loki(AGPL-3.0) · Promtail(AGPL-3.0)
# E06 T06-2 — Prometheus + Grafana + Loki + Promtail (관측성 스택)
# License note: Grafana/Loki AGPL-3.0 — 내부 사용 OK, 수정 배포 시 소스 공개 의무
#
# 기동: make observability-up
# 중단: make observability-down
# Grafana: http://localhost:3000 (admin / 초기 패스워드는 .env.observability 참조)

name: secuardian-observability

services:

  # ── Prometheus (메트릭 수집·저장) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: secuardian-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - prometheus-data:/prometheus
      - ../../deploy/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - observability-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Grafana (시각화·대시보드) ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: secuardian-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-SecureGrafana2026!}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:${GRAFANA_PORT:-3000}"
      GF_INSTALL_PLUGINS: "grafana-worldmap-panel"
      # 익명 접근 비활성화 (보안)
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 로그
      GF_LOG_MODE: "console"
      GF_LOG_LEVEL: "warn"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../deploy/config/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - observability-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Loki (로그 집계·저장) ────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.0
    container_name: secuardian-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki-data:/loki
      - ../../deploy/config/loki/loki.yml:/etc/loki/loki.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - observability-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Promtail (로그 수집 에이전트) ────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.1.0
    container_name: secuardian-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      # Docker 컨테이너 로그 수집
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 호스트 시스템 로그 (Wazuh, Falco, Caddy 등)
      - /var/log:/var/log:ro
      # SeCuardian 앱 로그 — /var/log 하위는 위 :ro 마운트 내부라 마운트포인트 생성 불가 → 별도 경로 사용
      - ../../logs:/var/log-secuardian:ro
      - ../../deploy/config/grafana/provisioning/promtail.yml:/etc/promtail/promtail.yml:ro
    networks:
      - observability-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  prometheus-data:
    name: secuardian-prometheus-data
  grafana-data:
    name: secuardian-grafana-data
  loki-data:
    name: secuardian-loki-data

networks:
  observability-net:
    driver: bridge
    name: secuardian-observability-net
