# Harbor 2.11.2 — SeCuardian dev (HTTP)
# License: Apache-2.0
# ⚠️  사전 실행 필요: make harbor-install
#     harbor_install.sh 가 deploy/docker/harbor-config/common/config/ 를 생성합니다.
# Port: http://localhost:8083

name: secuardian-harbor

services:
  harbor-log:
    image: goharbor/harbor-log:v2.11.2
    container_name: harbor-log
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    volumes:
      - /var/log/harbor/:/var/log/docker/:z
      - type: bind
        source: ./harbor-config/common/config/log/logrotate.conf
        target: /etc/logrotate.d/logrotate.conf
      - type: bind
        source: ./harbor-config/common/config/log/rsyslog_docker.conf
        target: /etc/rsyslog.d/rsyslog_docker.conf
    ports:
      - "127.0.0.1:1514:10514"
    networks:
      harbor-net:
          aliases: [log]

  registry:
    image: goharbor/registry-photon:v2.11.2
    container_name: registry
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - harbor-registry:/storage:z
      - type: bind
        source: ./harbor-config/common/config/registry/
        target: /etc/registry/
      - type: bind
        source: ./harbor-config/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor-net
    depends_on:
      - harbor-log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: registry

  registryctl:
    image: goharbor/harbor-registryctl:v2.11.2
    container_name: registryctl
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    env_file:
      - ./harbor-config/common/config/registryctl/env
    volumes:
      - harbor-registry:/storage:z
      # registryctl은 스토리지 드라이버 판별을 위해 registry 본체 설정도 함께 읽음(공식 compose 동일)
      - type: bind
        source: ./harbor-config/common/config/registry/
        target: /etc/registry/
      - type: bind
        source: ./harbor-config/common/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./harbor-config/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor-net
    depends_on:
      - harbor-log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: registryctl

  harbor-db:
    image: goharbor/harbor-db:v2.11.2
    container_name: harbor-db
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    env_file:
      - ./harbor-config/common/config/db/env
    volumes:
      - harbor-db:/var/lib/postgresql/data:z
    networks:
      harbor-net:
          aliases: [db, postgresql]
    depends_on:
      - harbor-log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: harbor-db

  harbor-core:
    image: goharbor/harbor-core:v2.11.2
    container_name: harbor-core
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    env_file:
      - ./harbor-config/common/config/core/env
    volumes:
      - harbor-ca:/etc/core/ca/:z
      - harbor-data:/data/:z
      - type: bind
        source: ./harbor-config/common/config/core/app.conf
        target: /etc/core/app.conf
      - type: bind
        source: ./harbor-config/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      harbor-net:
          aliases: [core]
    depends_on:
      - harbor-log
      - registry
      - harbor-db
      - redis
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: harbor-core

  harbor-portal:
    image: goharbor/harbor-portal:v2.11.2
    container_name: harbor-portal
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    volumes:
      - type: bind
        source: ./harbor-config/common/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      harbor-net:
          aliases: [portal]
    depends_on:
      - harbor-log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: harbor-portal

  harbor-jobservice:
    image: goharbor/harbor-jobservice:v2.11.2
    container_name: harbor-jobservice
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    env_file:
      - ./harbor-config/common/config/jobservice/env
    volumes:
      - harbor-joblogs:/var/log/jobs/:z
      - type: bind
        source: ./harbor-config/common/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./harbor-config/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      harbor-net:
          aliases: [jobservice]
    depends_on:
      - harbor-log
      - harbor-core
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: harbor-jobservice

  redis:
    image: goharbor/redis-photon:v2.11.2
    container_name: harbor-redis
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - harbor-redis:/var/lib/redis:z
    networks:
      - harbor-net
    depends_on:
      - harbor-log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: harbor-redis

  harbor-nginx:
    image: goharbor/nginx-photon:v2.11.2
    container_name: harbor-nginx
    restart: always
    dns_search: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    volumes:
      - type: bind
        source: ./harbor-config/common/config/nginx
        target: /etc/nginx
      - type: bind
        source: ./harbor-config/common/config/shared/trust-certificates
        target: /harbor_cust_cert
    ports:
      - "8083:8080"   # Harbor UI + API (HTTP dev)
      - "8444:8443"   # Harbor HTTPS (dev self-signed) — 8443은 Caddy(E04 T04-1)가 이미 사용 중이라 회피
    networks:
      - harbor-net
    depends_on:
      - harbor-log
      - registry
      - harbor-core
      - harbor-portal
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1514"
        tag: harbor-nginx

volumes:
  harbor-registry:
  harbor-db:
  harbor-redis:
  harbor-data:
  harbor-ca:
  harbor-joblogs:

networks:
  harbor-net:
    external: false
