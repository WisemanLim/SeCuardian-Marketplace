# Keycloak IAM/SSO — E01 T01-1 (ClaudePlan.md)
# License: Apache-2.0 (Keycloak), PostgreSQL License (PostgreSQL)
# Usage: internal only
#
# 기동: docker compose -f deploy/docker/docker-compose.keycloak.yml \
#              --env-file deploy/docker/.env.keycloak up -d
# 또는: make keycloak-up
#
# 주의:
#   - 개발: start-dev (HTTP, hostname-strict=false)
#   - 운영: start + Caddy TLS 터미네이션 전제 (KC_HOSTNAME 실제 도메인으로 변경)
#   - KC_DB_PASSWORD / KEYCLOAK_ADMIN_PASSWORD 는 .env.keycloak 에서 주입 (코드 하드코딩 금지)

services:
  # ── Keycloak 전용 PostgreSQL (메인 앱 DB와 분리) ────────────────────────────
  keycloak-db:
    image: postgres:16.4-alpine
    container_name: secuardian-keycloak-db
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_DATABASE:-keycloak}
      TZ: Asia/Seoul
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KC_DB_USERNAME:-keycloak} -d ${KC_DB_DATABASE:-keycloak}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Keycloak 26.x ────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: secuardian-keycloak
    # 개발: start-dev (HTTP + 자동 Realm 감지)
    # 운영 전환 시: start 로 변경 + KC_HOSTNAME 실제 도메인 설정
    command: start-dev
    environment:
      # ── DB 연결 ────────────────────────────────────────────────────────────
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: public

      # ── Admin 계정 (환경변수 전용) ─────────────────────────────────────────
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # ── 호스트 설정 ────────────────────────────────────────────────────────
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"        # 개발: 모든 hostname 허용

      # ── HTTP ───────────────────────────────────────────────────────────────
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

      # ── 관측성 ─────────────────────────────────────────────────────────────
      KC_HEALTH_ENABLED: "true"    # /health/ready — management port 9000
      KC_METRICS_ENABLED: "true"   # /metrics — Prometheus scrape 대상

      # ── 로깅 ───────────────────────────────────────────────────────────────
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
      TZ: Asia/Seoul

    ports:
      - "${KC_HTTP_PORT:-8880}:8080"   # Admin Console + OIDC 엔드포인트
      - "${KC_MGMT_PORT:-9880}:9000"   # Management (health/metrics)
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - keycloak-net
    healthcheck:
      # curl 미포함 이미지 대응: bash TCP redirect로 /health/ready 확인
      # 응답 예: {"status": "UP", ...} — "UP" 포함 여부로 판단
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s  # Keycloak 첫 기동 60-90초 소요
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  keycloak-net:
    driver: bridge
    name: secuardian-keycloak-net

volumes:
  keycloak-pgdata:
    name: secuardian-keycloak-pgdata
