<!--
  SeCuardian — Wazuh Manager 커스텀 설정 (E06 T06-1)
  License: GPL-2.0 (Wazuh)
  원본: /var/ossec/etc/ossec.conf (Wazuh Manager 컨테이너 기본값 기반)

  주요 커스터마이징:
  - 로그 보존: 365일 (ISMS-P 요구사항)
  - 알림 임계값: Level 7 이상 알림 (기본 3 → 상향)
  - Syscheck: 중요 경로 모니터링 추가
  - 연동 알림: SeCuardian webhook (T06 이후 활성화)
-->
<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>

    <!-- 로그 보존 365일 (ISMS-P §6.1 증거 보존) -->
    <stats>24</stats>
    <memory_size>8192</memory_size>
  </global>

  <!-- 알림 임계값: Level 7 이상만 알림 (FP 최소화) -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- 원격 에이전트 수신 (UDP 1514) -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- 파일 무결성 모니터링 (Syscheck) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>  <!-- 12시간마다 -->
    <scan_on_start>yes</scan_on_start>

    <!-- 모니터링 경로 -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/bin,/sbin,/boot</directories>
    <directories check_all="yes">/var/ossec</directories>

    <!-- 제외 경로 -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <!-- 변경 알림 설정 -->
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
  </syscheck>

  <!-- 루트킷 탐지 -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- 취약점 탐지 -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>12h</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <!-- Ubuntu 22.04 LTS -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Debian 12 -->
    <provider name="debian">
      <enabled>yes</enabled>
      <os>bookworm</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- NVD (National Vulnerability Database) -->
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_from_year>2020</update_from_year>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- 로그 분석 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <!-- 로그 보존 설정 (365일) — ISMS-P 준수 -->
  <reports>
    <category>authentication_success</category>
    <title>Daily Authentication Successes</title>
    <email_to>root@localhost</email_to>
  </reports>

  <!-- Wazuh DB(wazuh-db)는 4.x에서 항상 활성 — 레거시 <database_output><disabled> 블록은
       wazuh-dbd 설정 오류(1230 Invalid element 'disabled')를 유발하므로 제거 -->

  <!-- 에이전트 등록 (1515) -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force>
      <enabled>yes</enabled>
      <key_mismatch>yes</key_mismatch>
      <disconnect_time>1h</disconnect_time>
      <after_registration_time>1h</after_registration_time>
    </force>
  </auth>

  <!-- 클러스터 설정 (단일 노드) -->
  <cluster>
    <name>secuardian</name>
    <node_name>master-node</node_name>
    <node_type>master</node_type>
    <key>SecuardianCluster2026!</key>  <!-- TODO: 운영환경에서 Vault에서 주입 -->
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>localhost</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>

</ossec_config>
