name: Secret Scan

# ⚠️ TruffleHog License: AGPL-3.0
# CI에서 실행만 허용 — TruffleHog 소스 수정·재배포 시 소스 공개 의무 발생
# T02-4: Vault 마이그레이션(T02-3) 완료 후 활성화 — 기존 히스토리 무해 확인 후 운영

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 히스토리 스캔 (기존 커밋 포함)

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail
