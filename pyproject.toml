[project]
name = "secuardian"
version = "0.1.0"
description = "SeCuardian — FastAPI + Multi AI Agent (Orchestrator + AI Assistant)"
requires-python = ">=3.12"
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # db
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",          # local SQLite async
  # auth
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "pyotp>=2.9",
  # ai / llm — cloud
  "anthropic>=0.40",          # Orchestrator + Domain Agents (primary)
  "httpx>=0.27",              # Ollama REST fallback + A2A client + test
  # ai / llm — gateway (optional, uncomment if using LiteLLM Proxy)
  # "litellm>=1.40",
  # utils
  "python-dotenv>=1.0",
  "prometheus-client>=0.20",              # GET /metrics — Prometheus 스크레이프(E06 T06-2 observability)
  # secrets management (E02 T02-2)
  "hvac>=2.3",                            # HashiCorp Vault HTTP API client (BUSL-1.1 aware)
  "pgvector>=0.5.0",
  "psycopg[binary]>=3.3.4",
  "python-gnupg>=0.5.6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
